name: RaceFinder checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RACEFINDER_GPU: '0'
      RACEFINDER_DEVICE: cpu
      RACEFINDER_FACE_DEVICE: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --dir frontend exec playwright install chromium
      - run: pnpm --dir frontend exec playwright test
      - run: pnpm test
